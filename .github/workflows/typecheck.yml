name: Type check
run-name: Type checking

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  typecheck:
    name: 'Type Check'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check with tsc
        run: npx tsc --noEmit
