# Headless run of the malicious-mint demo on chain mode (Arbitrum Sepolia by default).
#
# Required env vars (read from .env or shell):
#   PARENT_CHAIN_RPC                  Arbitrum Sepolia (or other parent) RPC endpoint
#   MAIN_PRIVATE_KEY                  Funded deployer key on the parent chain
#
# Note: this headless command redeploys a fresh chain. If CHAIN_DEPLOYMENT_TRANSACTION_HASH
# points at a different chain than node-config.json, chainRestorePolicy: auto prevents stale
# local restore state from blocking the fresh demo.
#
# Run:
#   yarn run:script examples/malicious-mint.yaml

mode: chain
playbook: malicious-validator
command: malicious-mint
# auto sees this command redeploys and skips stale chain restore before the demo.
chainRestorePolicy: auto
# Set to "stop" only when you explicitly want headless to stop existing nitro-* containers first.
orphanContainerPolicy: warn
params:
  mainDepositAmount: "0.005"
  hackerDepositAmount: "0.001"
  hackerFundingAmount: "0.002"
# timeoutSeconds: 1800
